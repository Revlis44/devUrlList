name: devurllist-mariadb-test
services:
  db:
    image: mariadb:11.4.8
    environment:
      MARIADB_DATABASE: devurllist_test
      MARIADB_USER: devurllist_test
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-root-test-only
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-13316}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 40
