name: devurllist

services:
  app:
    image: node:24-bookworm-slim
    init: true
    restart: unless-stopped
    working_dir: /app
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["node", "--import", "/app/docker/logging.js", "/app/server.js"]
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /sqlite
      BACKUP_DIR: /backup
      LOG_DIR: /logs
      APP_ORIGIN: "${APP_ORIGIN:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      READ_ONLY: "${READ_ONLY:-false}"
      TRUST_PROXY_CIDRS: "${TRUST_PROXY_CIDRS:-}"
    ports:
      - "${BIND_IP:-0.0.0.0}:${APP_PORT:-8188}:3000"
    volumes:
      - type: bind
        source: ../app
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../sqlite
        target: /sqlite
        bind:
          create_host_path: false
      - type: bind
        source: ../logs
        target: /logs
        bind:
          create_host_path: false
      - type: bind
        source: ../backup
        target: /backup
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
