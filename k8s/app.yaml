apiVersion: v1
kind: ConfigMap
metadata:
  name: devurllist-config
  namespace: devurllist
data:
  NODE_ENV: production
  TZ: Asia/Seoul
  HOST: 0.0.0.0
  PORT: "3000"
  DB_CLIENT: mariadb
  DB_HOST: mariadb.devurllist.svc.cluster.local
  DB_PORT: "3306"
  DB_NAME: devurllist
  DB_USER: devurllist_app
  BACKUP_DIR: /backup
  APP_ORIGIN: https://devurl.intra.sayinfo.co.kr
  COOKIE_SECURE: "true"
  READ_ONLY: "false"
  TRUST_PROXY_CIDRS: ""
---
apiVersion: v1
kind: Service
metadata:
  name: devurllist
  namespace: devurllist
spec:
  selector:
    app: devurllist
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devurllist
  namespace: devurllist
spec:
  replicas: 2
  revisionHistoryLimit: 10
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: devurllist
  template:
    metadata:
      labels:
        app: devurllist
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: devurllist-harbor-pull
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: devurllist
      containers:
        - name: app
          image: __APP_IMAGE__
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: devurllist-config
            - secretRef:
                name: devurllist-db
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["node", "-e", "setTimeout(() => {}, 5000)"]
          volumeMounts:
            - name: backup
              mountPath: /backup
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: devurllist-backup
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devurllist
  namespace: devurllist
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: devurllist
