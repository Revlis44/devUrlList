apiVersion: v1
kind: Pod
metadata:
  labels:
    app: devurllist-ci
spec:
  serviceAccountName: devurllist-deployer
  securityContext:
    fsGroup: 1000
  containers:
    - name: node
      image: node:24.22.1-bookworm
      command: ["sh", "-c", "sleep 99d"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: "2", memory: 2Gi}
    - name: buildkit
      image: moby/buildkit:v0.34.2-rootless
      command: ["sh", "-c", "sleep 99d"]
      env:
        - {name: BUILDKITD_FLAGS, value: "--oci-worker-no-process-sandbox"}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: Unconfined}
        appArmorProfile: {type: Unconfined}
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: "2", memory: 2Gi}
      volumeMounts:
        - {name: registry-auth, mountPath: /home/user/.docker, readOnly: true}
    - name: mariadb-test
      image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
      env:
        - {name: MARIADB_DATABASE, value: devurllist_ci_test}
        - {name: MARIADB_USER, value: devurllist_test}
        - {name: MARIADB_PASSWORD, value: local-test-only}
        - {name: MARIADB_ROOT_PASSWORD, value: local-root-test-only}
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
      volumeMounts:
        - {name: test-db, mountPath: /var/lib/mysql}
  volumes:
    - name: registry-auth
      secret:
        secretName: devurllist-harbor-push
        optional: true
        items:
          - {key: .dockerconfigjson, path: config.json}
    - name: test-db
      emptyDir: {}
